[project]
name = "dynamic-agent-dataset-generation"
version = "0.1.0"
description = "Craftium/VoxeLibre raw dataset generator (player + dynamic mobs)"
readme = "README.md"
requires-python = "==3.11.*"
# Only the packages the raw-dataset generator actually imports. (World-model
# TRAINING deps - diffusers, accelerate, timm, etc. - are intentionally omitted.)
dependencies = [
    "tyro>=0.8.14",
    "setuptools==75.6.0",
    "loguru>=0.7.2",
    "GitPython>=3.1.44",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "xvfbwrapper==0.2.13",
    "ninja",
    "utils3d",
]

################ Dependency groups and conflicts ################

[dependency-groups]
cu = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "numpy==1.26.4",
]
env = [
  "craftium",
  "gymnasium==0.29.1",
]

[tool.uv]
default-groups = []

################ Package source ################

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", group = "cu" },
]
torchvision = [
  { index = "pytorch-cu126", group = "cu" },
]
# craftium is the game engine + our mods. It is NOT vendored in this repo; the
# setup script (./reinstall.sh) clones the fork into gym_envs/craftium first,
# then `uv sync` builds it from this path.
craftium = { path = "gym_envs/craftium" }
utils3d = { git = "https://github.com/EasternJournalist/utils3d", rev = "c5daf6f6c244d251f252102d09e9b7bcef791a38" }

################ Package index ################

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

################ Ruff settings ################

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
